<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>大谷チェッカー</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

  <style>
    :root {
      --color-accent: #005A9C;
      --color-accent-dark: #003F7A;
      --color-bg: #F8FAFC;
      --color-card: #FFFFFF;
      --color-text: #1A1A2E;
      --color-text-sub: #64748B;
      --color-border: #E2E8F0;
      --color-shadow: rgba(0, 0, 0, 0.08);
      --color-overlay: rgba(0, 0, 0, 0.5);
      --color-success: #22C55E;
      --color-error: #EF4444;

      --radius-card: 12px;
      --radius-modal: 20px 20px 0 0;
      --radius-btn: 10px;
      --radius-input: 10px;
      --radius-badge: 6px;
      --radius-full: 9999px;

      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      --font-main: 'Noto Sans JP', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', monospace;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);

      --header-height: 56px;

      /* MD3 Tokens */
      --md-primary: #005A9C;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #D4E3FF;
      --md-surface: #FFFBFE;
      --md-surface-container: #F0F4F8;
      --md-on-surface: #1A1A2E;
      --md-on-surface-variant: #42474E;
      --md-outline: #72777F;
      --md-outline-variant: #C2C7CF;
      --md-error: #BA1A1A;
      --md-elevation-1: 0px 1px 2px rgba(0,0,0,0.3), 0px 1px 3px 1px rgba(0,0,0,0.15);
      --md-elevation-2: 0px 1px 2px rgba(0,0,0,0.3), 0px 2px 6px 2px rgba(0,0,0,0.15);
      --md-elevation-3: 0px 1px 3px rgba(0,0,0,0.3), 0px 4px 8px 3px rgba(0,0,0,0.15);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: var(--font-main);
      background: var(--color-bg);
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Material Symbols ─── */
    .ms {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      user-select: none;
      flex-shrink: 0;
    }

    /* ─── Layout ─── */
    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100%;
      position: relative;
      background: var(--color-bg);
    }

    /* ─── Login Screen ─── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-xl) var(--space-lg);
      background: var(--color-card);
      text-align: center;
    }

    #login-screen.hidden {
      display: none;
    }

    .login-icon {
      font-size: 64px;
      margin-bottom: var(--space-lg);
      line-height: 1;
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--color-accent);
      margin-bottom: var(--space-sm);
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 15px;
      color: var(--color-text-sub);
      line-height: 1.6;
      margin-bottom: var(--space-xl);
    }

    #google-signin-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 14px var(--space-xl);
      background: var(--color-card);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-full);
      font-family: var(--font-main);
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px var(--color-shadow);
    }

    #google-signin-btn:hover {
      border-color: var(--color-accent);
      box-shadow: 0 4px 16px rgba(0, 90, 156, 0.2);
      transform: translateY(-1px);
    }

    #google-signin-btn:active {
      transform: translateY(0);
    }

    .google-logo {
      width: 20px;
      height: 20px;
    }

    .login-note {
      margin-top: var(--space-lg);
      font-size: 12px;
      color: var(--color-text-sub);
    }

    /* ─── Main App ─── */
    #main-app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    #main-app.hidden {
      display: none;
    }

    /* ─── Header (MD3 Top App Bar - Small) ─── */
    #header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--color-accent);
      padding: calc(var(--safe-top) + 12px) 4px 12px 16px;
      display: flex;
      align-items: center;
      gap: 0;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .header-title {
      flex: 1;
      font-size: 22px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0;
      line-height: 1.3;
    }

    /* MD3 Icon Button (on colored surface) */
    .header-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
      margin-right: 4px;
    }

    .header-btn:hover { background: rgba(255,255,255,0.12); }
    .header-btn:active { background: rgba(255,255,255,0.18); }

    /* ─── Account Menu (MD3 Menu) ─── */
    #account-menu {
      position: fixed;
      top: calc(var(--safe-top) + 64px);
      right: max(8px, calc((100vw - 480px) / 2 + 8px));
      background: #FFFBFE;
      border-radius: 4px;
      box-shadow: var(--md-elevation-2);
      overflow: hidden;
      z-index: 200;
      min-width: 220px;
    }

    #account-menu.hidden { display: none; }

    .account-info {
      padding: 12px 16px;
      border-bottom: 1px solid var(--md-outline-variant);
    }

    .account-email {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      word-break: break-all;
      line-height: 1.4;
    }

    .account-menu-item {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: none;
      background: none;
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 500;
      color: var(--md-error);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }

    .account-menu-item:hover { background: rgba(186,26,26,0.08); }

    /* ─── Search Bar (MD3 Search Bar) ─── */
    #search-bar {
      background: var(--color-bg);
      padding: 8px 16px 12px;
      border-bottom: none;
    }

    #search-bar.hidden { display: none; }

    #search-input {
      width: 100%;
      height: 48px;
      padding: 0 20px;
      border: none;
      border-radius: 28px;
      font-family: var(--font-main);
      font-size: 16px;
      outline: none;
      background: #E3ECF5;
      color: var(--md-on-surface);
      transition: background 0.2s;
    }

    #search-input::placeholder { color: var(--md-on-surface-variant); }
    #search-input:focus { background: #D4E3F5; }

    /* ─── Skeleton ─── */
    #skeleton-screen { padding: 16px; }
    #skeleton-screen.hidden { display: none; }

    @keyframes shimmer {
      0% { background-position: -480px 0; }
      100% { background-position: 480px 0; }
    }

    .skeleton-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 8px;
      box-shadow: var(--md-elevation-1);
    }

    .skeleton-line {
      height: 14px;
      border-radius: 7px;
      background: linear-gradient(90deg, #EFEFEF 25%, #E5E5E5 50%, #EFEFEF 75%);
      background-size: 480px 100%;
      animation: shimmer 1.4s infinite linear;
      margin-bottom: 10px;
    }

    .skeleton-line.short { width: 40%; }
    .skeleton-line.medium { width: 65%; }
    .skeleton-line.tall { height: 24px; width: 55%; }

    /* ─── Empty State (MD3) ─── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      text-align: center;
      min-height: 60vh;
    }

    #empty-state.hidden { display: none; }

    .empty-icon {
      width: 80px;
      height: 80px;
      background: #D4E3FF; /* MD3 primary-container */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: var(--color-accent);
    }

    .empty-title {
      font-size: 22px;   /* MD3 Headline Small */
      font-weight: 500;
      color: var(--md-on-surface);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .empty-sub {
      font-size: 14px;   /* MD3 Body Medium */
      color: var(--md-on-surface-variant);
      line-height: 1.6;
    }

    /* ─── List ─── */
    #sightings-list {
      padding: 0 16px calc(88px + var(--safe-bottom));
    }

    .month-section { margin-bottom: 4px; }

    /* MD3 sticky section header */
    .month-header {
      position: sticky;
      top: var(--header-height);
      z-index: 50;
      padding: 16px 0 8px;
      background: var(--color-bg);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .month-label {
      font-size: 14px;   /* MD3 Label Large */
      font-weight: 500;
      color: var(--md-on-surface-variant);
      letter-spacing: 0.1px;
    }

    .month-count {
      font-size: 12px;
      font-weight: 500;
      background: #D4E3FF;  /* MD3 primary-container */
      color: var(--color-accent);
      padding: 2px 10px;
      border-radius: 8px;
      letter-spacing: 0.1px;
    }

    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* MD3 Elevated Card */
    .sighting-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 8px;
      cursor: pointer;
      box-shadow: var(--md-elevation-1);
      transition: box-shadow 0.2s, transform 0.15s;
      animation: fadeInCard 0.25s ease forwards;
    }

    .sighting-card:hover {
      box-shadow: var(--md-elevation-2);
      transform: translateY(-1px);
    }

    .sighting-card:active {
      transform: scale(0.99);
      box-shadow: var(--md-elevation-1);
    }

    /* Date/time: Headline Small */
    .card-datetime {
      font-size: 24px;
      font-weight: 400;
      color: var(--md-on-surface);
      margin-bottom: 6px;
      letter-spacing: 0;
      line-height: 1.2;
    }

    /* Location: Label Medium */
    .card-location {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 3px;
      line-height: 1.4;
    }

    /* Title: Body Large / weight 500 */
    .card-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--md-on-surface);
      margin-bottom: 4px;
      line-height: 1.4;
    }

    /* Note: Body Medium */
    .sighting-note {
      font-size: 14px;
      color: var(--md-on-surface-variant);
      margin-bottom: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
      line-height: 1.4;
    }

    /* MD3 Assist Chip style */
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 12px;   /* MD3 Label Small */
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 8px;
      letter-spacing: 0.1px;
    }

    .badge--text {
      background: #D4E3FF;
      color: #00419A;
    }

    .badge--photo {
      background: #D4E4FF;
      color: #1556CA;
    }

    /* ─── FAB ─── */
    #fab {
      position: fixed;
      bottom: calc(var(--space-lg) + var(--safe-bottom));
      right: max(var(--space-lg), calc((100vw - 480px) / 2 + var(--space-lg)));
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--color-accent);
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: var(--md-elevation-3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      z-index: 90;
    }

    #fab.hidden {
      display: none;
    }

    #fab:hover {
      transform: scale(1.04);
      background: var(--color-accent-dark);
    }

    #fab:active {
      transform: scale(0.95);
    }

    #fab .ms {
      font-size: 24px;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* ─── Modal Base ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--color-overlay);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      background: #FFFBFE;
      border-radius: 28px 28px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--md-elevation-2);
    }

    @keyframes slideUpModal {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-overlay:not(.hidden) .modal-sheet {
      animation: slideUpModal 0.3s cubic-bezier(0.32, 0.72, 0, 1) forwards;
    }

    .modal-handle {
      width: 32px;
      height: 4px;
      background: var(--md-outline-variant);
      border-radius: 2px;
      margin: 16px auto 0;
      flex-shrink: 0;
    }

    .modal-header {
      display: flex;
      align-items: center;
      padding: 16px 24px 12px;
      flex-shrink: 0;
      gap: 8px;
    }

    .modal-title {
      flex: 1;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--md-on-surface);
      line-height: 1.3;
    }

    .modal-close-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      color: var(--md-on-surface-variant);
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .modal-close-btn:hover {
      background: rgba(0,0,0,0.08);
    }

    .modal-close-btn:active {
      background: rgba(0,0,0,0.12);
    }

    .modal-body {
      padding: 4px 24px calc(24px + var(--safe-bottom));
      overflow-y: auto;
      flex: 1;
      scrollbar-width: none;
    }

    .modal-body::-webkit-scrollbar {
      display: none;
    }

    /* ─── Form (legacy, used in edit form) ─── */
    .form-group {
      margin-bottom: var(--space-md);
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-sub);
      margin-bottom: var(--space-xs);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 12px var(--space-md);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-input);
      font-family: var(--font-main);
      font-size: 15px;
      color: var(--color-text);
      background: var(--color-bg);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(0, 90, 156, 0.15);
    }

    .form-textarea {
      resize: none;
      min-height: 80px;
      line-height: 1.5;
    }

    /* ─── MD3 Outlined Text Field ─── */
    .md3-field {
      position: relative;
      margin-bottom: 20px;
    }

    .md3-input,
    .md3-textarea {
      width: 100%;
      border: 1px solid var(--md-outline);
      border-radius: 4px;
      font-family: var(--font-main);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--md-on-surface);
      background: transparent;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      display: block;
      box-sizing: border-box;
    }

    .md3-input {
      height: 56px;
      padding: 20px 16px 8px;
    }

    .md3-textarea {
      padding: 28px 16px 10px;
      min-height: 120px;
      resize: none;
    }

    .md3-input:hover, .md3-textarea:hover { border-color: var(--md-on-surface); }

    .md3-input:focus, .md3-textarea:focus {
      border-width: 2px;
      border-color: var(--color-accent);
      padding-left: 15px;
    }

    .md3-textarea:focus { padding-left: 15px; }

    .md3-label {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-main);
      font-size: 16px;
      line-height: 1;
      color: var(--md-on-surface-variant);
      background: #FFFBFE;
      padding: 0 4px;
      pointer-events: none;
      transition: top 0.15s cubic-bezier(0.4,0,0.2,1),
                  font-size 0.15s cubic-bezier(0.4,0,0.2,1),
                  color 0.15s;
      white-space: nowrap;
    }

    .md3-textarea-label { top: 20px; transform: none; }

    .md3-input:focus + .md3-label,
    .md3-input:not(:placeholder-shown) + .md3-label {
      top: 0; transform: translateY(-50%); font-size: 12px;
    }

    .md3-textarea:focus + .md3-label,
    .md3-textarea:not(:placeholder-shown) + .md3-label {
      top: 0; transform: translateY(-50%); font-size: 12px;
    }

    .md3-input:focus + .md3-label,
    .md3-textarea:focus + .md3-label { color: var(--color-accent); }

    /* ─── MD3 Display Field ─── */
    .md3-display-field {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 56px;
      border: 1px solid var(--md-outline);
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.15s;
      background: transparent;
    }

    .md3-display-field:hover { border-color: var(--md-on-surface); }
    .md3-display-field:active { border-color: var(--color-accent); border-width: 2px; }

    .md3-display-leading { color: var(--md-on-surface-variant); font-size: 20px; flex-shrink: 0; }
    .md3-display-content { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
    .md3-display-sublabel { font-size: 12px; line-height: 1; color: var(--md-on-surface-variant); margin-bottom: 2px; }
    .md3-display-value { font-size: 16px; line-height: 1.3; color: var(--md-on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .md3-display-value.placeholder { color: var(--md-on-surface-variant); }
    .md3-display-trailing { color: var(--md-on-surface-variant); font-size: 20px; flex-shrink: 0; }

    /* ─── Form Location Loading ─── */
    .form-location-loading {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 56px;
      border: 1px solid var(--md-outline-variant);
      border-radius: 4px;
      background: transparent;
    }

    .form-location-loading.hidden { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--md-outline-variant);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    .loading-text { font-size: 14px; color: var(--md-on-surface-variant); }

    /* ─── Photo button - MD3 Outlined Button ─── */
    .photo-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 40px;
      padding: 0 24px;
      border: 1px solid var(--md-outline);
      border-radius: 20px;
      background: transparent;
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 500;

    .detail-row-value { font-size: 16px; color: var(--md-on-surface); line-height: 1.5; }
    .detail-row-value.empty { color: var(--md-on-surface-variant); font-style: italic; }

    .detail-header-actions { display: flex; gap: 8px; align-items: center; }

    .btn-sm {
      height: 36px; padding: 0 16px; border-radius: 18px;
      font-family: var(--font-main); font-size: 13px; font-weight: 500;
      cursor: pointer; border: none; letter-spacing: 0.1px;
    }

    .btn-sm-outline { background: transparent; border: 1px solid var(--md-outline); color: var(--color-accent); }
    .btn-sm-outline:hover { background: rgba(0,90,156,0.08); border-color: var(--color-accent); }
    .btn-sm-danger { background: #FFDAD6; color: #410002; border: none; }
    .btn-sm-danger:hover { background: #FFB4AB; }

    /* ─── Confirm Dialog - MD3 ─── */
    #confirm-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 400; display: flex;
      align-items: center; justify-content: center;
      padding: 24px;
    }

    #confirm-overlay.hidden { display: none; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .confirm-dialog {
      width: 100%; max-width: 312px;
      background: #FFFBFE;
      border-radius: 28px;
      padding: 24px;
      animation: popIn 0.2s cubic-bezier(0.05,0.7,0.1,1) forwards;
      box-shadow: var(--md-elevation-3);
    }

    .confirm-title { font-size: 22px; font-weight: 500; margin-bottom: 16px; color: var(--md-on-surface); line-height: 1.3; }
    .confirm-body { font-size: 14px; color: var(--md-on-surface-variant); margin-bottom: 24px; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ─── Toast - MD3 Snackbar ─── */
    #toast {
      position: fixed;
      bottom: calc(80px + var(--safe-bottom));
      left: 50%; transform: translateX(-50%);
      z-index: 500; pointer-events: none;
      width: calc(100% - 32px); max-width: 440px;
    }

    .toast-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      border-radius: 4px;
      font-size: 14px; font-weight: 400; color: #fff;
      box-shadow: 0 3px 5px -1px rgba(0,0,0,0.2), 0 6px 10px rgba(0,0,0,0.14), 0 1px 18px rgba(0,0,0,0.12);
      margin-bottom: 8px; line-height: 1.4;
    }

    .toast-item.success { background: #323232; }
    .toast-item.error { background: #B3261E; }

    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

    .toast-item.entering { animation: toastIn 0.25s ease forwards; }
    .toast-item.leaving { animation: toastOut 0.3s ease forwards; }

    /* iOS自動ズーム防止 */
    input, textarea, select {
      font-size: 16px !important;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    /* =============================================
       Supabase 設定
       ============================================= */
    const SUPABASE_URL = 'https://wkfxbgidlojjbtsuyoea.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_eNDt0aCRCX7ChUUB_QRfrQ_ghDKS_i8';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* =============================================
       状態管理
       ============================================= */
    let allSightings = [];
    let currentUser = null;
    let pendingDeleteId = null;
    let editingId = null;

    /* =============================================
       認証
       ============================================= */
    async function signInWithGoogle() {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: 'https://madppp.github.io/ohtani-checker/' }
      });
      if (error) showToast('ログインに失敗しました: ' + error.message, 'error');
    }

    async function signOut() {
      await supabase.auth.signOut();
    }

    function showLoginScreen() {
      currentUser = null;
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('main-app').classList.add('hidden');
      document.getElementById('fab').classList.add('hidden');
    }

    function showMainApp(user) {
      currentUser = user;
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      document.getElementById('account-email').textContent = user.email || user.user_metadata?.full_name || 'ログイン済み';
      loadSightings();
    }

    /* =============================================
       データ操作（Supabase）
       ============================================= */
    async function getAllSightings() {
      const { data, error } = await supabase
        .from('sightings')
        .select('*')
        .order('datetime', { ascending: false });
      if (error) throw error;
      return data || [];
    }

    async function createSighting(sightingData) {
      const { data, error } = await supabase
        .from('sightings')
        .insert({ ...sightingData, user_id: currentUser.id })
        .select()
        .single();
      if (error) throw error;
      return data;
    }

    async function updateSighting(id, updates) {
      const { data, error } = await supabase
        .from('sightings')
        .update({ ...updates, updated_at: new Date().toISOString() })
        .eq('id', id)
        .select()
        .single();
      if (error) throw error;
      return data;
    }

    async function deleteSighting(id) {
      const { error } = await supabase
        .from('sightings')
        .delete()
        .eq('id', id);
      if (error) throw error;
    }

    /* =============================================
       位置情報
       ============================================= */
    async function reverseGeocode(lat, lng) {
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
          { headers: { 'Accept-Language': 'ja' } }
        );
        const data = await res.json();
        return data.address?.city || data.address?.town || data.address?.village || data.display_name || `${lat.toFixed(4)},${lng.toFixed(4)}`;
      } catch {
        return `${lat.toFixed(4)},${lng.toFixed(4)}`;
      }
    }

    async function getCurrentPosition() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) { resolve(null); return; }
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const label = await reverseGeocode(lat, lng);
            resolve({ lat, lng, label });
          },
          () => resolve(null),
          { enableHighAccuracy: true, timeout: 10000 }
        );
      });
    }

    /* =============================================
       EXIF解析
       ============================================= */
    async function extractPhotoMetadata(file) {
      try {
        const result = await exifr.parse(file, {
          gps: true,
          pick: ['DateTimeOriginal', 'GPSLatitude', 'GPSLongitude']
        });

        if (!result) return { datetime: null, location: null };

        let datetime = null;
        if (result.DateTimeOriginal) {
          let d;
          if (result.DateTimeOriginal instanceof Date) {
            // exifr は new Date(y, m, d, h, min, s) でローカル時刻として生成する
            // → そのまま toISOString() でUTCに変換して保存し、
            //   表示時に getHours()（ローカル）で戻すと正しい時刻になる
            d = result.DateTimeOriginal;
          } else {
            // 文字列 "2026:03:29 17:11:00" → ローカル時刻として解釈
            const str = result.DateTimeOriginal.replace(/^(\d{4}):(\d{2}):(\d{2})/, '$1-$2-$3');
            d = new Date(str);
          }
          if (!isNaN(d.getTime())) {
            datetime = d.toISOString();
          }
        }

        let location = null;
        if (result.latitude != null && result.longitude != null) {
          const label = await reverseGeocode(result.latitude, result.longitude);
          location = { lat: result.latitude, lng: result.longitude, label };
        }

        return { datetime, location };
      } catch (e) {
        console.warn('EXIF解析エラー:', e);
        return { datetime: null, location: null };
      }
    }

    /* =============================================
       日時フォーマット
       ============================================= */
    const WEEKDAY_JA = ['日', '月', '火', '水', '木', '金', '土'];

    function formatDatetime(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return isoString;
      const year = d.getFullYear();
      const month = d.getMonth() + 1;
      const day = d.getDate();
      const wday = WEEKDAY_JA[d.getDay()];
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${year}年${month}月${day}日（${wday}）${hh}:${mm}`;
    }

    function formatCardDatetime(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return isoString;
      const day = d.getDate();
      const wday = WEEKDAY_JA[d.getDay()];
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${day}（${wday}）${hh}:${mm}`;
    }

    function formatMonthSection(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      return `${d.getFullYear()}年${d.getMonth() + 1}月`;
    }

    function toDatetimeLocal(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return '';
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    /* =============================================
       データ読み込み
       ============================================= */
    async function loadSightings() {
      showSkeleton();
      try {
        allSightings = await getAllSightings();
        renderSightingsList(allSightings);
      } catch (e) {
        console.error('データ取得エラー:', e);
        showToast('データの読み込みに失敗しました', 'error');
      } finally {
        hideSkeleton();
        document.getElementById('fab').classList.remove('hidden');
      }
    }

    /* =============================================
       リストレンダリング
       ============================================= */
    function filterSightings(sightings, query) {
      if (!query) return sightings;
      const q = query.toLowerCase();
      return sightings.filter(s =>
        s.title?.toLowerCase().includes(q) ||
        s.location_label?.toLowerCase().includes(q) ||
        s.note?.toLowerCase().includes(q)
      );
    }

    function renderSightingsList(sightings, query = '') {
      const list = document.getElementById('sightings-list');
      const empty = document.getElementById('empty-state');
      const filtered = filterSightings(sightings, query);

      list.innerHTML = '';

      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      // 月別グループ
      const groups = new Map();
      for (const s of filtered) {
        const key = formatMonthSection(s.datetime);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(s);
      }

      for (const [month, items] of groups) {
        const section = document.createElement('div');
        section.className = 'month-section';

        const header = document.createElement('div');
        header.className = 'month-header';
        header.innerHTML = `
        <span class="month-label">${month}</span>
        <span class="month-count">${items.length}件</span>
      `;
        section.appendChild(header);

        for (const item of items) {
          section.appendChild(renderSightingCard(item));
        }
        list.appendChild(section);
      }
    }

    function renderSightingCard(s) {
      const card = document.createElement('div');
      card.className = 'sighting-card';
      card.dataset.id = s.id;

      const locationHtml = s.location_label
        ? `<div class="card-location"><span class="ms" style="font-size:12px">location_on</span>${s.location_label}</div>`
        : '';
      const titleHtml = s.title
        ? `<div class="card-title">${escapeHtml(s.title)}</div>`
        : '';
      const noteHtml = s.note
        ? `<div class="sighting-note">${escapeHtml(s.note)}</div>`
        : '';

      card.innerHTML = `
      <div class="card-datetime">${formatCardDatetime(s.datetime)}</div>
      ${locationHtml}
      ${titleHtml}
      ${noteHtml}
      <span class="badge badge--${s.source}">${s.source}</span>
    `;
      card.addEventListener('click', () => openDetailModal(s));
      return card;
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* =============================================
       スケルトン
       ============================================= */
    function showSkeleton() {
      document.getElementById('skeleton-screen').classList.remove('hidden');
      document.getElementById('sightings-list').innerHTML = '';
      document.getElementById('empty-state').classList.add('hidden');
    }
    function hideSkeleton() {
      document.getElementById('skeleton-screen').classList.add('hidden');
    }

    /* =============================================
       Add Modal
       ============================================= */
    function showAddModal() {
      const modal = document.getElementById('add-modal');
      modal.classList.remove('hidden');
      document.getElementById('add-title').value = '';
      document.getElementById('add-note').value = '';
      document.getElementById('add-photo-status').textContent = '';
      document.getElementById('add-photo-status').classList.remove('error');
      document.getElementById('add-photo-file').value = '';
      document.getElementById('add-photo-file').dataset.source = 'text';

      // 現在時刻をセット
      const now = new Date().toISOString();
      setAddDatetime(now);

      // Geolocation
      showLocationLoading();
      getCurrentPosition().then(pos => {
        hideLocationLoading();
        if (pos) {
          setAddLocation(pos);
        } else {
          setAddLocation({ lat: null, lng: null, label: '' });
          showToast('場所を取得できませんでした。手動で入力してください', 'error');
        }
      });
    }

    function hideAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }

    function setAddDatetime(isoString) {
      const display = document.getElementById('add-datetime-display');
      const input = document.getElementById('add-datetime-input');
      const text = document.getElementById('add-datetime-text');

      input.value = toDatetimeLocal(isoString);
      text.textContent = formatDatetime(isoString);
      text.classList.remove('placeholder');
      display.classList.remove('hidden');
      input.classList.add('hidden');
    }

    function showLocationLoading() {
      document.getElementById('add-location-loading').classList.remove('hidden');
      document.getElementById('add-location-display').classList.add('hidden');
      document.getElementById('add-location-input').classList.add('hidden');
    }

    function hideLocationLoading() {
      document.getElementById('add-location-loading').classList.add('hidden');
    }

    function setAddLocation(pos) {
      const display = document.getElementById('add-location-display');
      const input = document.getElementById('add-location-input');
      const text = document.getElementById('add-location-text');

      document.getElementById('add-location-lat').value = pos.lat ?? '';
      document.getElementById('add-location-lng').value = pos.lng ?? '';
      input.value = pos.label || '';

      if (pos.label) {
        text.textContent = pos.label;
        text.classList.remove('placeholder');
      } else {
        text.textContent = '場所を入力してください';
        text.classList.add('placeholder');
      }
      display.classList.remove('hidden');
      input.classList.add('hidden');
    }

    function buildAddFormData() {
      const datetimeInput = document.getElementById('add-datetime-input');
      const locationInput = document.getElementById('add-location-input');
      const source = document.getElementById('add-photo-file').dataset.source || 'text';

      const datetimeVal = datetimeInput.classList.contains('hidden')
        ? (datetimeInput.value ? new Date(datetimeInput.value).toISOString() : new Date().toISOString())
        : (datetimeInput.value ? new Date(datetimeInput.value).toISOString() : new Date().toISOString());

      const locationVal = locationInput.value.trim();
      const lat = parseFloat(document.getElementById('add-location-lat').value) || null;
      const lng = parseFloat(document.getElementById('add-location-lng').value) || null;

      return {
        title: document.getElementById('add-title').value.trim() || null,
        note: document.getElementById('add-note').value.trim() || null,
        datetime: datetimeVal,
        lat: lat,
        lng: lng,
        location_label: locationVal || null,
        source,
      };
    }

    /* =============================================
       Detail Modal
       ============================================= */
    function openDetailModal(s) {
      editingId = s.id;

      document.getElementById('detail-modal-title').textContent = '詳細';
      document.getElementById('detail-view').classList.remove('hidden');
      document.getElementById('detail-form').classList.add('hidden');
      document.getElementById('detail-edit-btn').classList.remove('hidden');
      document.getElementById('detail-delete-btn').classList.remove('hidden');

      // 詳細ビュー構築
      const view = document.getElementById('detail-view');
      view.innerHTML = `
      <div class="detail-row">
        <div class="detail-row-icon"><span class="ms" style="font-size:20px">event</span></div>
        <div class="detail-row-body">
          <div class="detail-row-label">日時</div>
          <div class="detail-row-value">${formatDatetime(s.datetime)}</div>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-row-icon"><span class="ms" style="font-size:20px">location_on</span></div>
        <div class="detail-row-body">
          <div class="detail-row-label">場所</div>
          <div class="detail-row-value ${s.location_label ? '' : 'empty'}">${escapeHtml(s.location_label) || '未設定'}</div>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-row-icon"><span class="ms" style="font-size:20px">label</span></div>
        <div class="detail-row-body">
          <div class="detail-row-label">タイトル</div>
          <div class="detail-row-value ${s.title ? '' : 'empty'}">${escapeHtml(s.title) || '未設定'}</div>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-row-icon"><span class="ms" style="font-size:20px">description</span></div>
        <div class="detail-row-body">
          <div class="detail-row-label">メモ</div>
          <div class="detail-row-value ${s.note ? '' : 'empty'}" style="white-space:pre-wrap">${escapeHtml(s.note) || '未設定'}</div>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-row-icon"><span class="ms" style="font-size:20px">layers</span></div>
        <div class="detail-row-body">
          <div class="detail-row-label">登録方法</div>
          <div class="detail-row-value"><span class="badge badge--${s.source}">${s.source}</span></div>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-row-icon"><span class="ms" style="font-size:20px">schedule</span></div>
        <div class="detail-row-body">
          <div class="detail-row-label">登録日</div>
          <div class="detail-row-value">${formatDatetime(s.created_at)}</div>
        </div>
      </div>
    `;

      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function switchToEditMode(s) {
      const sighting = allSightings.find(x => x.id === editingId);
      if (!sighting) return;

      document.getElementById('detail-modal-title').textContent = '編集';
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('detail-form').classList.remove('hidden');
      document.getElementById('detail-edit-btn').classList.add('hidden');
      document.getElementById('detail-delete-btn').classList.add('hidden');

      document.getElementById('edit-title').value = sighting.title || '';
      document.getElementById('edit-note').value = sighting.note || '';
      document.getElementById('edit-datetime').value = toDatetimeLocal(sighting.datetime);
      document.getElementById('edit-location').value = sighting.location_label || '';
    }

    function hideDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      editingId = null;
    }

    /* =============================================
       Toast
       ============================================= */
    function showToast(message, type = 'success', duration = 2500) {
      const container = document.getElementById('toast');
      const item = document.createElement('div');
      item.className = `toast-item ${type} entering`;
      item.textContent = message;
      container.appendChild(item);

      setTimeout(() => {
        item.classList.remove('entering');
        item.classList.add('leaving');
        item.addEventListener('animationend', () => item.remove(), { once: true });
      }, duration);
    }

    /* =============================================
       Icons 再描画（Material Symbols使用のため空関数）
       ============================================= */
    function refreshIcons() {}

    /* =============================================
       Init & Event Listeners
       ============================================= */
    async function init() {
      // 認証状態の監視
      supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
          showMainApp(session.user);
        } else {
          showLoginScreen();
        }
      });

      // 初期セッション確認
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showMainApp(session.user);
      } else {
        showLoginScreen();
      }

      // ─── Login ───
      document.getElementById('google-signin-btn').addEventListener('click', signInWithGoogle);

      // ─── Account Menu ───
      document.getElementById('account-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('account-menu').classList.toggle('hidden');
      });
      document.getElementById('signout-btn').addEventListener('click', () => {
        document.getElementById('account-menu').classList.add('hidden');
        signOut();
      });
      document.addEventListener('click', () => {
        document.getElementById('account-menu').classList.add('hidden');
      });

      // ─── Search ───
      document.getElementById('search-btn').addEventListener('click', () => {
        const bar = document.getElementById('search-bar');
        bar.classList.toggle('hidden');
        if (!bar.classList.contains('hidden')) {
          document.getElementById('search-input').focus();
        } else {
          document.getElementById('search-input').value = '';
          renderSightingsList(allSightings);
        }
      });
      document.getElementById('search-input').addEventListener('input', (e) => {
        renderSightingsList(allSightings, e.target.value.trim());
        refreshIcons();
      });

      // ─── FAB ───
      document.getElementById('fab').addEventListener('click', () => {
        if (navigator.vibrate) navigator.vibrate(10);
        showAddModal();
        refreshIcons();
      });

      // ─── Add Modal ───
      document.getElementById('add-close-btn').addEventListener('click', hideAddModal);
      document.getElementById('add-cancel-btn').addEventListener('click', hideAddModal);
      document.getElementById('add-modal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) hideAddModal();
      });

      // Datetime toggle
      document.getElementById('add-datetime-display').addEventListener('click', () => {
        document.getElementById('add-datetime-display').classList.add('hidden');
        document.getElementById('add-datetime-input').classList.remove('hidden');
        document.getElementById('add-datetime-input').focus();
      });
      document.getElementById('add-datetime-input').addEventListener('change', (e) => {
        if (e.target.value) {
          setAddDatetime(new Date(e.target.value).toISOString());
        }
      });
      document.getElementById('add-datetime-input').addEventListener('blur', (e) => {
        if (e.target.value) {
          setAddDatetime(new Date(e.target.value).toISOString());
        } else {
          document.getElementById('add-datetime-display').classList.remove('hidden');
          document.getElementById('add-datetime-input').classList.add('hidden');
        }
      });

      // Location toggle
      document.getElementById('add-location-display').addEventListener('click', () => {
        document.getElementById('add-location-display').classList.add('hidden');
        const input = document.getElementById('add-location-input');
        input.classList.remove('hidden');
        input.focus();
      });
      document.getElementById('add-location-input').addEventListener('blur', (e) => {
        const val = e.target.value.trim();
        setAddLocation({
          lat: parseFloat(document.getElementById('add-location-lat').value) || null,
          lng: parseFloat(document.getElementById('add-location-lng').value) || null,
          label: val
        });
      });

      // Photo
      document.getElementById('add-photo-btn').addEventListener('click', () => {
        document.getElementById('add-photo-file').click();
      });
      document.getElementById('add-photo-file').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        const statusEl = document.getElementById('add-photo-status');
        if (!file) return;

        statusEl.textContent = 'EXIFを解析中…';
        statusEl.classList.remove('error');

        const { datetime, location } = await extractPhotoMetadata(file);

        if (datetime) {
          setAddDatetime(datetime);
          showToast('📅 写真の撮影日時を取得しました', 'success');
        } else {
          showToast('⚠️ 日時情報が見つかりません。手動で入力してください', 'error');
        }
        if (location) {
          setAddLocation(location);
          showToast('📍 写真の位置情報を取得しました', 'success');
        } else {
          showToast('⚠️ 位置情報が見つかりません。手動で入力してください', 'error');
        }

        statusEl.textContent = (datetime || location) ? '写真から情報を取得しました' : 'この写真には情報がありません。手動で入力してください';
        if (!datetime && !location) statusEl.classList.add('error');

        document.getElementById('add-photo-file').dataset.source = 'photo';
        e.target.value = '';
      });

      // Add Form Submit
      document.getElementById('add-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('add-save-btn');
        btn.disabled = true;
        btn.textContent = '保存中…';

        try {
          const data = buildAddFormData();
          await createSighting(data);
          hideAddModal();
          showToast('✅ 記録しました！', 'success');
          await loadSightings();
          refreshIcons();
        } catch (err) {
          console.error('保存エラー:', err);
          showToast('データの保存に失敗しました', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = '保存する';
        }
      });

      // ─── Detail Modal ───
      document.getElementById('detail-close-btn').addEventListener('click', hideDetailModal);
      document.getElementById('detail-modal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) hideDetailModal();
      });
      document.getElementById('detail-edit-btn').addEventListener('click', () => {
        switchToEditMode();
      });
      document.getElementById('detail-delete-btn').addEventListener('click', () => {
        pendingDeleteId = editingId;
        document.getElementById('confirm-overlay').classList.remove('hidden');
      });

      // Edit form
      document.getElementById('edit-cancel-btn').addEventListener('click', () => {
        const s = allSightings.find(x => x.id === editingId);
        if (s) openDetailModal(s);
      });
      document.getElementById('detail-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('edit-save-btn');
        btn.disabled = true;
        btn.textContent = '更新中…';

        try {
          const updates = {
            title: document.getElementById('edit-title').value.trim() || null,
            note: document.getElementById('edit-note').value.trim() || null,
            datetime: new Date(document.getElementById('edit-datetime').value).toISOString(),
            location_label: document.getElementById('edit-location').value.trim() || null,
          };
          await updateSighting(editingId, updates);
          hideDetailModal();
          showToast('✅ 更新しました！', 'success');
          await loadSightings();
          refreshIcons();
        } catch (err) {
          console.error('更新エラー:', err);
          showToast('更新に失敗しました', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = '更新する';
        }
      });

      // ─── Confirm Dialog ───
      document.getElementById('confirm-yes').addEventListener('click', async () => {
        document.getElementById('confirm-overlay').classList.add('hidden');
        if (!pendingDeleteId) return;
        try {
          await deleteSighting(pendingDeleteId);
          pendingDeleteId = null;
          hideDetailModal();
          showToast('🗑️ 削除しました', 'success');
          await loadSightings();
          refreshIcons();
        } catch (err) {
          console.error('削除エラー:', err);
          showToast('削除に失敗しました', 'error');
        }
      });
      document.getElementById('confirm-no').addEventListener('click', () => {
        document.getElementById('confirm-overlay').classList.add('hidden');
        pendingDeleteId = null;
      });
      document.getElementById('confirm-overlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
          document.getElementById('confirm-overlay').classList.add('hidden');
          pendingDeleteId = null;
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>

</html>
